name: Windows deployment smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-deployment-smoke.yml"
      - "deploy/windows/**"
      - "frontend/app.js"
      - "frontend/data.js"
      - "frontend/index.html"
      - "frontend/styles.css"
      - "frontend/artifact-layout.js"
      - "frontend/attenuation-bins.js"
      - "frontend/target-config.js"
      - "frontend/assets/**"
      - "frontend/vendor/**"
      - "frontend/demo/knet-demo.json"
      - "frontend/demo/japan-prefectures.geojson"
      - "frontend/demo/world-land.geojson"
      - "frontend/demo/site_data/**"
      - "local_archive_server.py"
      - "process_events_windows.py"
      - "csmnc_reader.py"
      - "tianditu_250k.py"
      - "start_windows.bat"
      - "START_ZHEN_SHILAN.bat"
      - "tests/test_deployment_bundle.py"
  pull_request:
    paths:
      - ".github/workflows/windows-deployment-smoke.yml"
      - "deploy/windows/**"
      - "frontend/**"
      - "local_archive_server.py"
      - "process_events_windows.py"
      - "csmnc_reader.py"
      - "tianditu_250k.py"
      - "start_windows.bat"
      - "START_ZHEN_SHILAN.bat"
      - "tests/test_deployment_bundle.py"

permissions:
  contents: read

concurrency:
  group: windows-deployment-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONNOUSERSITE: "1"
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip
          cache-dependency-path: deploy/windows/requirements-windows.lock.txt

      - name: Install locked Windows dependencies
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r deploy/windows/requirements-windows.lock.txt

      - name: Run deployment unit tests
        shell: pwsh
        run: |
          python tests/test_deployment_bundle.py
          python -m py_compile local_archive_server.py process_events_windows.py csmnc_reader.py tianditu_250k.py
          python -m py_compile deploy/windows/build_ci_smoke_bundle.py deploy/windows/run_windows_smoke.py

      - name: Build slim Windows fixture
        id: bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "ZhenShiLan-Windows-smoke"
          $logs = Join-Path $env:RUNNER_TEMP "zsl-smoke-logs"
          python deploy/windows/build_ci_smoke_bundle.py --output $bundle
          "bundle=$bundle" >> $env:GITHUB_OUTPUT
          "logs=$logs" >> $env:GITHUB_OUTPUT

      - name: Verify runtime imports and bundled maps
        shell: pwsh
        run: |
          python deploy/windows/verify_windows_runtime.py `
            --project-root "${{ steps.bundle.outputs.bundle }}" `
            --map-root "${{ steps.bundle.outputs.bundle }}\data\admin_geojson" `
            --allow-host-python

      - name: Start through batch entrypoint and test HTTP surface
        shell: pwsh
        run: |
          python deploy/windows/run_windows_smoke.py `
            --bundle "${{ steps.bundle.outputs.bundle }}" `
            --log-dir "${{ steps.bundle.outputs.logs }}" `
            --port 8765 `
            --timeout 90

      - name: Archive slim fixture
        if: always()
        shell: pwsh
        run: |
          $bundle = "${{ steps.bundle.outputs.bundle }}"
          $zip = Join-Path $env:RUNNER_TEMP "ZhenShiLan-Windows-smoke.zip"
          if (Test-Path $bundle) {
            Compress-Archive -Path "$bundle\*" -DestinationPath $zip -Force
          }

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-logs
          path: ${{ steps.bundle.outputs.logs }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload slim Windows fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZhenShiLan-Windows-smoke
          path: ${{ runner.temp }}/ZhenShiLan-Windows-smoke.zip
          if-no-files-found: error
          retention-days: 7
